<VirtualHost *:80>
    ServerName einkauf.deine-domain.de

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket-Upgrade erkennen und an ws:// weiterleiten
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:3000/$1 [P,L]

    # HTTP → Node-Backend
    ProxyPass / http://127.0.0.1:950/
    ProxyPassReverse / http://127.0.0.1:950/

    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>